apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: monitoring
  name: devsecops-production-alerts
  namespace: monitoring
spec:
  groups:
  - name: devsecops.application
    rules:
    - alert: DevSecOpsDeploymentUnavailable
      annotations:
        description: Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace
          }} has fewer available replicas than desired for more than 5 minutes.
        summary: Deployment has unavailable replicas
      expr: |
        kube_deployment_status_replicas_available{
          namespace= "devsecops"
        }
        <
        kube_deployment_spec_replicas {
          namespace= "devsecops"
        }
      for: 5m
      labels:
        severity: critical
        team: devsecops
    - alert: DevSecOpsPodRestarting
      annotations:
        description: Pod {{ $labels.pod }} in container {{ $labels.container }} restarted
          more than 3 times within 10 minutes.
        summary: Pod is restarting repeatedly
      expr: |
        increase(
          kube_pod_container_status_restarts_total {
            namespace= "devsecops"
          }[10m]
        ) > 3
      for: 5m
      labels:
        severity: warning
        team: devsecops
    - alert: DevSecOpsPodNotReady
      annotations:
        description: Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has
          been not ready for more than 5 minutes.
        summary: DevSecOps pod is not ready
      expr: |
        kube_pod_status_ready{
          namespace="devsecops",
          condition="true"
        } == 0
      for: 5m
      labels:
        severity: critical
        team: devsecops
  - name: devsecops.infrastructure
    rules:
    - alert: KubernetesNodeMemoryHigh
      annotations:
        description: Node {{ $labels.instance }} memory usage has been above 85% for
          more than 10 minutes.
        summary: Kubernetes node memory usage is high
      expr: |
        (
          1 -
          node_memory_MemAvailable_bytes
          /
          node_memory_MemTotal_bytes
        ) * 100 > 85
      for: 10m
      labels:
        severity: warning
        team: devsecops
    - alert: KubernetesNodeMemoryCritical
      annotations:
        description: Node {{ $labels.instance }} memory usage has been above 95% for
          more than 5 minutes.
        summary: Kubernetes node memory usage is critical
      expr: |
        (
          1 -
          node_memory_MemAvailable_bytes
          /
          node_memory_MemTotal_bytes
        ) * 100 > 95
      for: 5m
      labels:
        severity: critical
        team: devsecops
    - alert: KubernetesNodeCPUHigh
      annotations:
        description: Node {{ $labels.instance }} CPU usage has been above 85% for
          more than 10 minutes.
        summary: Kubernetes node CPU usage is high
      expr: |
        100 - (
          avg by (instance) (
            rate(node_cpu_seconds_total{
              mode="idle"
            }[5m])
          ) * 100
        ) > 85
      for: 10m
      labels:
        severity: warning
        team: devsecops
  - name: devsecops.monitoring
    rules:
    - alert: PrometheusTargetDown
      annotations:
        description: Prometheus target {{ $labels.job }} at {{ $labels.instance }}
          has been down for more than 5 minutes.
        summary: Prometheus target is down
      expr: |
        up == 0
      for: 5m
      labels:
        severity: critical
        team: devsecops
    - alert: PrometheusTooManyTargetsDown
      annotations:
        description: More than 3 Prometheus targets are currently down.
        summary: Multiple Prometheus targets are down
      expr: |
        count(up == 0) > 3
      for: 5m
      labels:
        severity: critical
        team: devsecops
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: monitoring
  name: devsecops-services
  namespace: devsecops
spec:
  endpoints:
  - interval: 15s
    path: /actuator/prometheus
    port: http
  namespaceSelector:
    matchNames:
    - devsecops
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - user-service
      - product-service
      - order-service
