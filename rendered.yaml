  name: frontend-blue
  namespace: devsecops-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-blue
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: frontend-blue
    spec:
      containers:
      - image: 124666675720.dkr.ecr.ap-south-1.amazonaws.com/devsecops-frontend:11
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          periodSeconds: 20
          timeoutSeconds: 5
        name: frontend
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-blue
  namespace: devsecops-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service-blue
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: order-service-blue
    spec:
      containers:
      - args:
        - -javaagent:/otel/opentelemetry-javaagent.jar
        - -jar
        - /app/app.jar
        command:
        - java
        env:
        - name: OTEL_SERVICE_NAME
          value: order-service
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://tempo.tempo.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: PRODUCT_SERVICE_URL
          value: http://product-service-blue.devsecops-blue.svc.cluster.local:8082
        image: 124666675720.dkr.ecr.ap-south-1.amazonaws.com/devsecops-order-service:11
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          periodSeconds: 20
          timeoutSeconds: 5
        name: order-service
        ports:
        - containerPort: 8083
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /actuator/health
            port: 8083
          periodSeconds: 10
          timeoutSeconds: 5
