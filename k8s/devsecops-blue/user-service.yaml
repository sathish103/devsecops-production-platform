apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-blue
  namespace: devsecops-blue

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: user-service-blue

  template:
    metadata:
      labels:
        app: user-service-blue

    spec:
      serviceAccountName: devsecops-app

      containers:
        - name: user-service

          image: 124666675720.dkr.ecr.ap-south-1.amazonaws.com/devsecops-user-service:0fecf2b8d41851f9636a0ce5612fe820d17515f3

          command:
            - java

          args:
            - "-javaagent:/otel/opentelemetry-javaagent.jar"
            - "-jar"
            - "/app/app.jar"

          ports:
            - containerPort: 8081

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            # MySQL connection
            - name: DB_HOST
              value: mysql.database.svc.cluster.local

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: userdb

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devsecops-mysql
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsecops-mysql
                  key: password

            # OpenTelemetry
            - name: OTEL_SERVICE_NAME
              value: user-service

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.tempo.svc.cluster.local:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: OTEL_TRACES_EXPORTER
              value: otlp

            - name: OTEL_METRICS_EXPORTER
              value: none

            - name: OTEL_LOGS_EXPORTER
              value: none

          volumeMounts:
            - name: mysql-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: mysql-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: devsecops-mysql-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: user-service-blue
  namespace: devsecops-blue

spec:
  type: ClusterIP

  selector:
    app: user-service-blue

  ports:
    - name: http
      port: 8081
      targetPort: 8081