apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-blue
  namespace: devsecops-blue

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: product-service-blue

  template:
    metadata:
      labels:
        app: product-service-blue

    spec:
      containers:
        - name: product-service
          image: 124666675720.dkr.ecr.ap-south-1.amazonaws.com/devsecops-product-service:0fecf2b8d41851f9636a0ce5612fe820d17515f3

          command:
            - java
          args:
            - "-javaagent:/otel/opentelemetry-javaagent.jar"
            - "-jar"
            - "/app/app.jar"

          ports:
            - containerPort: 8082

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            - name: OTEL_SERVICE_NAME
              value: product-service

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.tempo.svc.cluster.local:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: OTEL_TRACES_EXPORTER
              value: otlp

            - name: OTEL_METRICS_EXPORTER
              value: none

            - name: OTEL_LOGS_EXPORTER
              value: none

            # AWS Secrets Manager integration will replace
            # Kubernetes Secret references in the next step.

---
apiVersion: v1
kind: Service
metadata:
  name: product-service-blue
  namespace: devsecops-blue

spec:
  type: ClusterIP

  selector:
    app: product-service-blue

  ports:
    - name: http
      port: 8082
      targetPort: 8082



