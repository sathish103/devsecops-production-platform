apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: devsecops-mysql-secrets
  namespace: devsecops-blue

spec:
  provider: aws

  parameters:
    region: ap-south-1
    usePodIdentity: "true"

    objects: |
      - objectName: "devsecops/mysql"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: mysql-username
            filePermission: "0400"
          - path: password
            objectAlias: mysql-password
            filePermission: "0400"
            
      - objectName: "devsecops/jwt"
        objectType: "secretsmanager"
        jmesPath:
          - path: secret
            objectAlias: jwt-secret
            filePermission: "0400"
          - path: expiration
            objectAlias: jwt-expiration
            filePermission: "0400"