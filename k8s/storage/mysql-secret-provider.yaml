apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mysql-secrets
  namespace: database
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "devsecops/mysql"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: username
          - path: password
            objectAlias: password