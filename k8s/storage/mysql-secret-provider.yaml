apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mysql-secrets
  namespace: database
spec:
  provider: aws
  parameters:
    region: ap-south-1
    usePodIdentity: "true"
    objects: |
      - objectName: "devsecops/mysql"
        objectType: "secretsmanager"
        jmesPath:
          - path: password
            objectAlias: mysql-root-password
            filePermission: "0400"