apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: product-route
  namespace: devsecops
spec:
  parentRefs:
    - name: devsecops-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/products
      backendRefs:
        - name: product-service-blue
          namespace: devsecops-blue
          port: 8082
          weight: 100
        - name: product-service-green
          namespace: devsecops-green
          port: 8082
          weight: 0