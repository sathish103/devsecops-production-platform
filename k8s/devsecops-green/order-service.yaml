apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-green
  namespace: devsecops-green

spec:
  replicas: 1

  strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

  selector:
    matchLabels:
      app: order-service-green

  template:
    metadata:
      labels:
        app: order-service-green

    spec:
      serviceAccountName: devsecops-app

      containers:
        - name: order-service

          image: 124666675720.dkr.ecr.ap-south-1.amazonaws.com/devsecops-order-service:0fecf2b8d41851f9636a0ce5612fe820d17515f3

          command:
            - /bin/sh
            - -c

          args:
            - |
              export DB_USERNAME="$(cat /mnt/secrets-store/mysql-username)"
              export DB_PASSWORD="$(cat /mnt/secrets-store/mysql-password)"
              exec java \
                -javaagent:/otel/opentelemetry-javaagent.jar \
                -jar \
                /app/app.jar

          ports:
            - containerPort: 8083

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            # MySQL connection
            - name: DB_HOST
              value: mysql.database.svc.cluster.local

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: orderdb

            # OpenTelemetry
            - name: OTEL_SERVICE_NAME
              value: order-service

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.tempo.svc.cluster.local:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: OTEL_TRACES_EXPORTER
              value: otlp

            - name: OTEL_METRICS_EXPORTER
              value: none

            - name: OTEL_LOGS_EXPORTER
              value: none

            # Product service
            - name: PRODUCT_SERVICE_URL
              value: http://product-service-green.devsecops-green.svc.cluster.local:8082

          volumeMounts:
            - name: mysql-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: mysql-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: devsecops-mysql-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: order-service-green
  namespace: devsecops-green

spec:
  type: ClusterIP

  selector:
    app: order-service-green

  ports:
    - name: http
      port: 8083
      targetPort: 8083