name: DevSecOps Blue-Green Production Deployment

on:
  workflow_run:
    workflows:
      - DevSecOps CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

# Prevent two production deployments from modifying
# the Blue-Green traffic state at the same time.
concurrency:
  group: production-blue-green
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: devsecops-eks
  ECR_REGISTRY: 124666675720.dkr.ecr.ap-south-1.amazonaws.com

  USER_IMAGE: devsecops-user-service
  PRODUCT_IMAGE: devsecops-product-service
  ORDER_IMAGE: devsecops-order-service
  FRONTEND_IMAGE: devsecops-frontend

  PRODUCTION_NAMESPACE: devsecops


jobs:

  # ============================================================
  # 1. PREPARE PRODUCTION CANDIDATE
  # ============================================================

  prepare:
    name: Prepare Production Candidate
    runs-on: ubuntu-latest

    # Only continue when the CI workflow completed successfully
    # for a push to main.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    outputs:
      version: ${{ steps.release.outputs.version }}
      active_env: ${{ steps.environment.outputs.active_env }}
      inactive_env: ${{ steps.environment.outputs.inactive_env }}

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # ----------------------------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124666675720:role/GitHubActions-DevSecOps-Production
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -e

          echo "========================================="
          echo "AWS IDENTITY"
          echo "========================================="

          aws sts get-caller-identity

      # ----------------------------------------------------------
      # EKS ACCESS
      # ----------------------------------------------------------

      - name: Configure kubectl
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          echo "========================================="
          echo "KUBERNETES CONTEXT"
          echo "========================================="

          kubectl config current-context

          echo
          kubectl cluster-info

      # ----------------------------------------------------------
      # DETERMINE RELEASE VERSION
      # ----------------------------------------------------------

      - name: Determine release version
        id: release
        run: |
          set -e

          VERSION="${{ github.event.workflow_run.head_sha }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "========================================="
          echo "RELEASE VERSION"
          echo "========================================="
          echo "$VERSION"

      # ----------------------------------------------------------
      # DETERMINE ACTIVE / INACTIVE ENVIRONMENT
      # ----------------------------------------------------------

      - name: Detect active environment
        id: environment
        run: |
          set -e

          echo "========================================="
          echo "DETECTING PRODUCTION STATE"
          echo "========================================="

          ACTIVE_ENV=""

          # Determine the active environment from the frontend route.
          # All routes are validated afterward to ensure they agree.

          FRONTEND_BACKEND=$(kubectl get httproute frontend-route \
            -n "$PRODUCTION_NAMESPACE" \
            -o jsonpath='{.spec.rules[0].backendRefs[0].name}')

          echo "frontend-route -> $FRONTEND_BACKEND"

          if [[ "$FRONTEND_BACKEND" == "frontend-blue" ]]; then
            ACTIVE_ENV="blue"
            INACTIVE_ENV="green"

          elif [[ "$FRONTEND_BACKEND" == "frontend-green" ]]; then
            ACTIVE_ENV="green"
            INACTIVE_ENV="blue"

          else
            echo "ERROR: Cannot determine active environment."
            echo "Unexpected backend: $FRONTEND_BACKEND"
            exit 1
          fi

          echo
          echo "Validating all production routes..."

          declare -A EXPECTED_SERVICES

          EXPECTED_SERVICES[frontend-route]="frontend-$ACTIVE_ENV"
          EXPECTED_SERVICES[user-route]="user-service-$ACTIVE_ENV"
          EXPECTED_SERVICES[product-route]="product-service-$ACTIVE_ENV"
          EXPECTED_SERVICES[order-route]="order-service-$ACTIVE_ENV"

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            BACKEND=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].name}')

            EXPECTED="${EXPECTED_SERVICES[$ROUTE]}"

            echo "$ROUTE -> $BACKEND"

            if [[ "$BACKEND" != "$EXPECTED" ]]; then
              echo
              echo "ERROR: Production routes are inconsistent."
              echo "Route    : $ROUTE"
              echo "Expected : $EXPECTED"
              echo "Actual   : $BACKEND"
              exit 1
            fi
          done

          echo
          echo "========================================="
          echo "DEPLOYMENT STATE"
          echo "========================================="
          echo "ACTIVE   : $ACTIVE_ENV"
          echo "INACTIVE : $INACTIVE_ENV"

          echo "active_env=$ACTIVE_ENV" >> "$GITHUB_OUTPUT"
          echo "inactive_env=$INACTIVE_ENV" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # DEPLOY NEW VERSION TO INACTIVE ENVIRONMENT
      # ----------------------------------------------------------

      - name: Deploy new version to inactive environment
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARGET_ENV: ${{ steps.environment.outputs.inactive_env }}
        run: |
          set -e

          NAMESPACE="devsecops-$TARGET_ENV"

          echo "========================================="
          echo "DEPLOYING PRODUCTION CANDIDATE"
          echo "========================================="
          echo "Environment : $TARGET_ENV"
          echo "Namespace   : $NAMESPACE"
          echo "Version     : $VERSION"

          declare -A DEPLOYMENTS
          declare -A IMAGES

          DEPLOYMENTS[frontend]="frontend-$TARGET_ENV"
          DEPLOYMENTS[user-service]="user-service-$TARGET_ENV"
          DEPLOYMENTS[product-service]="product-service-$TARGET_ENV"
          DEPLOYMENTS[order-service]="order-service-$TARGET_ENV"

          IMAGES[frontend]="$ECR_REGISTRY/$FRONTEND_IMAGE:$VERSION"
          IMAGES[user-service]="$ECR_REGISTRY/$USER_IMAGE:$VERSION"
          IMAGES[product-service]="$ECR_REGISTRY/$PRODUCT_IMAGE:$VERSION"
          IMAGES[order-service]="$ECR_REGISTRY/$ORDER_IMAGE:$VERSION"

          for SERVICE in \
            frontend \
            user-service \
            product-service \
            order-service
          do

            DEPLOYMENT="${DEPLOYMENTS[$SERVICE]}"
            IMAGE="${IMAGES[$SERVICE]}"

            echo
            echo "-----------------------------------------"
            echo "Deployment : $DEPLOYMENT"
            echo "Container  : $SERVICE"
            echo "Image      : $IMAGE"
            echo "-----------------------------------------"

            kubectl -n "$NAMESPACE" \
              set image deployment/"$DEPLOYMENT" \
              "$SERVICE"="$IMAGE"
          done

      # ----------------------------------------------------------
      # WAIT FOR ROLLOUT
      # ----------------------------------------------------------

      - name: Wait for candidate rollout
        env:
          TARGET_ENV: ${{ steps.environment.outputs.inactive_env }}
        run: |
          set -e

          NAMESPACE="devsecops-$TARGET_ENV"

          echo "========================================="
          echo "WAITING FOR CANDIDATE ROLLOUT"
          echo "========================================="

          for DEPLOYMENT in \
            frontend-$TARGET_ENV \
            user-service-$TARGET_ENV \
            product-service-$TARGET_ENV \
            order-service-$TARGET_ENV
          do

            echo
            echo "Waiting for $DEPLOYMENT..."

            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              -n "$NAMESPACE" \
              --timeout=5m
          done

      # ----------------------------------------------------------
      # VERIFY CANDIDATE DEPLOYMENTS
      # ----------------------------------------------------------

      - name: Verify candidate deployments
        env:
          TARGET_ENV: ${{ steps.environment.outputs.inactive_env }}
        run: |
          set -e

          NAMESPACE="devsecops-$TARGET_ENV"

          echo "========================================="
          echo "VERIFYING CANDIDATE DEPLOYMENTS"
          echo "========================================="

          for DEPLOYMENT in \
            frontend-$TARGET_ENV \
            user-service-$TARGET_ENV \
            product-service-$TARGET_ENV \
            order-service-$TARGET_ENV
          do

            echo
            echo "-----------------------------------------"
            echo "Deployment : $DEPLOYMENT"
            echo "-----------------------------------------"

            READY=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.readyReplicas}')

            AVAILABLE=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.availableReplicas}')

            UPDATED=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.updatedReplicas}')

            DESIRED=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.replicas}')

            echo "Desired replicas   : $DESIRED"
            echo "Updated replicas    : ${UPDATED:-0}"
            echo "Ready replicas     : ${READY:-0}"
            echo "Available replicas : ${AVAILABLE:-0}"

            if [[ "${READY:-0}" != "$DESIRED" ]]; then
              echo
              echo "ERROR: $DEPLOYMENT is not fully ready."
              exit 1
            fi

            if [[ "${AVAILABLE:-0}" != "$DESIRED" ]]; then
              echo
              echo "ERROR: $DEPLOYMENT does not have all replicas available."
              exit 1
            fi

            if [[ "${UPDATED:-0}" != "$DESIRED" ]]; then
              echo
              echo "ERROR: $DEPLOYMENT does not have all replicas updated."
              exit 1
            fi

          done

          echo
          echo "========================================="
          echo "ALL CANDIDATE DEPLOYMENTS ARE HEALTHY"
          echo "========================================="

      # ----------------------------------------------------------
      # VERIFY IMAGE VERSION
      # ----------------------------------------------------------

      - name: Verify candidate image versions
        env:
          TARGET_ENV: ${{ steps.environment.outputs.inactive_env }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -e

          NAMESPACE="devsecops-$TARGET_ENV"

          echo "========================================="
          echo "VERIFYING CANDIDATE IMAGES"
          echo "========================================="

          for DEPLOYMENT in \
            frontend-$TARGET_ENV \
            user-service-$TARGET_ENV \
            product-service-$TARGET_ENV \
            order-service-$TARGET_ENV
          do

            IMAGE=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "$DEPLOYMENT -> $IMAGE"

            if [[ "$IMAGE" != *":$VERSION" ]]; then
              echo
              echo "ERROR: Wrong image version."
              echo "Expected: $VERSION"
              echo "Actual  : $IMAGE"
              exit 1
            fi
          done

          echo
          echo "All candidate deployments use version $VERSION."

      # ----------------------------------------------------------
      # CANDIDATE SUMMARY
      # ----------------------------------------------------------

      - name: Candidate ready
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ACTIVE_ENV: ${{ steps.environment.outputs.active_env }}
          INACTIVE_ENV: ${{ steps.environment.outputs.inactive_env }}
        run: |
          echo
          echo "============================================================"
          echo "             PRODUCTION CANDIDATE READY"
          echo "============================================================"
          echo
          echo "CURRENT ACTIVE : $ACTIVE_ENV"
          echo "NEW CANDIDATE  : $INACTIVE_ENV"
          echo "VERSION        : $VERSION"
          echo
          echo "Production traffic has NOT been changed."
          echo
          echo "============================================================"


  # ============================================================
  # 2. SWITCH PRODUCTION TRAFFIC
  # ============================================================

  switch:
    name: Switch Production Traffic
    needs: prepare
    runs-on: ubuntu-latest

    # GitHub Environment protection/approval belongs here.
    environment:
      name: production

    steps:

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124666675720:role/GitHubActions-DevSecOps-Production
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # EKS
      # ----------------------------------------------------------

      - name: Configure kubectl
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      # ----------------------------------------------------------
      # SHOW CURRENT STATE
      # ----------------------------------------------------------

      - name: Show current production traffic
        run: |
          set -e

          echo "========================================="
          echo "CURRENT PRODUCTION TRAFFIC"
          echo "========================================="

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            echo
            echo "----- $ROUTE -----"

            kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{range .spec.rules[0].backendRefs[*]}{.name}{" = "}{.weight}{"%"}{"\n"}{end}'
          done

      # ----------------------------------------------------------
      # SWITCH ALL ROUTES
      # ----------------------------------------------------------

      - name: Switch production to new environment
        env:
          ACTIVE_ENV: ${{ needs.prepare.outputs.active_env }}
          INACTIVE_ENV: ${{ needs.prepare.outputs.inactive_env }}
        run: |
          set -e

          echo "========================================="
          echo "SWITCHING PRODUCTION TRAFFIC"
          echo "========================================="
          echo "OLD ACTIVE : $ACTIVE_ENV"
          echo "NEW ACTIVE : $INACTIVE_ENV"

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            case "$ROUTE" in

              frontend-route)
                NEW_SERVICE="frontend-$INACTIVE_ENV"
                PORT=80
                ;;

              user-route)
                NEW_SERVICE="user-service-$INACTIVE_ENV"
                PORT=8081
                ;;

              product-route)
                NEW_SERVICE="product-service-$INACTIVE_ENV"
                PORT=8082
                ;;

              order-route)
                NEW_SERVICE="order-service-$INACTIVE_ENV"
                PORT=8083
                ;;

            esac

            echo
            echo "Updating $ROUTE"
            echo "NEW SERVICE : $NEW_SERVICE"
            echo "NEW WEIGHT  : 100%"

            kubectl patch httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              --type='json' \
              -p="[
                {
                  \"op\": \"replace\",
                  \"path\": \"/spec/rules/0/backendRefs\",
                  \"value\": [
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"$NEW_SERVICE\",
                      \"namespace\": \"devsecops-$INACTIVE_ENV\",
                      \"port\": $PORT,
                      \"weight\": 100
                    }
                  ]
                }
              ]"

          done

      # ----------------------------------------------------------
      # VERIFY SWITCH
      # ----------------------------------------------------------

      - name: Verify production switch
        env:
          EXPECTED_ENV: ${{ needs.prepare.outputs.inactive_env }}
        run: |
          set -e

          echo "========================================="
          echo "VERIFYING PRODUCTION SWITCH"
          echo "========================================="

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            BACKEND=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].name}')

            WEIGHT=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].weight}')

            echo "$ROUTE -> $BACKEND = $WEIGHT%"

            if [[ "$BACKEND" != *"-$EXPECTED_ENV" ]]; then
              echo "ERROR: $ROUTE is not pointing to $EXPECTED_ENV."
              exit 1
            fi

            if [[ "$WEIGHT" != "100" ]]; then
              echo "ERROR: $ROUTE is not receiving 100% traffic."
              exit 1
            fi
          done

          echo
          echo "Production traffic successfully switched."


  # ============================================================
  # 3. FINAL PRODUCTION VERIFICATION
  # ============================================================

  verify:
    name: Verify Production Deployment
    needs: [prepare, switch]
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124666675720:role/GitHubActions-DevSecOps-Production
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # EKS
      # ----------------------------------------------------------

      - name: Configure kubectl
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      # ----------------------------------------------------------
      # VERIFY ROUTES
      # ----------------------------------------------------------

      - name: Verify production routes
        env:
          EXPECTED_ENV: ${{ needs.prepare.outputs.inactive_env }}
        run: |
          set -e

          echo "========================================="
          echo "FINAL PRODUCTION VERIFICATION"
          echo "========================================="

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            BACKEND=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].name}')

            WEIGHT=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].weight}')

            echo "$ROUTE -> $BACKEND = $WEIGHT%"

            if [[ "$BACKEND" != *"-$EXPECTED_ENV" ]]; then
              echo "ERROR: Wrong production environment."
              exit 1
            fi

            if [[ "$WEIGHT" != "100" ]]; then
              echo "ERROR: Production traffic is not 100%."
              exit 1
            fi
          done

      # ----------------------------------------------------------
      # VERIFY DEPLOYMENT
      # ----------------------------------------------------------

      - name: Verify production deployments
        env:
          TARGET_ENV: ${{ needs.prepare.outputs.inactive_env }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e

          NAMESPACE="devsecops-$TARGET_ENV"

          echo "========================================="
          echo "VERIFYING ACTIVE PRODUCTION VERSION"
          echo "========================================="

          for DEPLOYMENT in \
            frontend-$TARGET_ENV \
            user-service-$TARGET_ENV \
            product-service-$TARGET_ENV \
            order-service-$TARGET_ENV
          do

            IMAGE=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "$DEPLOYMENT -> $IMAGE"

            if [[ "$IMAGE" != *":$VERSION" ]]; then
              echo "ERROR: Production deployment has unexpected image."
              echo "Expected: $VERSION"
              echo "Actual  : $IMAGE"
              exit 1
            fi

            READY=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.readyReplicas}')

            DESIRED=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.replicas}')

            echo "Ready replicas: ${READY:-0}"
            echo "Desired replicas: $DESIRED"

            if [[ "${READY:-0}" != "$DESIRED" ]]; then
              echo "ERROR: Deployment is not fully ready."
              exit 1
            fi
          done

      # ----------------------------------------------------------
      # FINAL SUMMARY
      # ----------------------------------------------------------

      - name: Production deployment complete
        env:
          OLD_ENV: ${{ needs.prepare.outputs.active_env }}
          NEW_ENV: ${{ needs.prepare.outputs.inactive_env }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo
          echo "============================================================"
          echo "       DEVSECOPS BLUE-GREEN DEPLOYMENT COMPLETE"
          echo "============================================================"
          echo
          echo "OLD ENVIRONMENT : $OLD_ENV"
          echo "NEW ENVIRONMENT : $NEW_ENV"
          echo "VERSION         : $VERSION"
          echo
          echo "PRODUCTION:"
          echo "100% -> $NEW_ENV"
          echo "0%   -> $OLD_ENV"
          echo
          echo "============================================================"


  # ============================================================
  # 4. AUTOMATIC ROLLBACK
  # ============================================================

  rollback:
    name: Rollback Production Traffic
    needs: [prepare, switch, verify]
    runs-on: ubuntu-latest

    # Roll back only when:
    # - prepare succeeded
    # - production switch or final verification failed
    # - traffic may have been changed
    if: >
      always() &&
      needs.prepare.result == 'success' &&
      (needs.switch.result == 'failure' || needs.verify.result == 'failure')

    steps:

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124666675720:role/GitHubActions-DevSecOps-Production
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # EKS
      # ----------------------------------------------------------

      - name: Configure kubectl
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      # ----------------------------------------------------------
      # RESTORE OLD ENVIRONMENT
      # ----------------------------------------------------------

      - name: Restore previous production environment
        env:
          OLD_ENV: ${{ needs.prepare.outputs.active_env }}
        run: |
          set -e

          echo "========================================="
          echo "ROLLING BACK PRODUCTION"
          echo "========================================="
          echo "RESTORING : $OLD_ENV"
          echo

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            case "$ROUTE" in

              frontend-route)
                OLD_SERVICE="frontend-$OLD_ENV"
                PORT=80
                ;;

              user-route)
                OLD_SERVICE="user-service-$OLD_ENV"
                PORT=8081
                ;;

              product-route)
                OLD_SERVICE="product-service-$OLD_ENV"
                PORT=8082
                ;;

              order-route)
                OLD_SERVICE="order-service-$OLD_ENV"
                PORT=8083
                ;;

            esac

            echo
            echo "Restoring $ROUTE"
            echo "SERVICE : $OLD_SERVICE"
            echo "WEIGHT  : 100%"

            kubectl patch httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              --type='json' \
              -p="[
                {
                  \"op\": \"replace\",
                  \"path\": \"/spec/rules/0/backendRefs\",
                  \"value\": [
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"$OLD_SERVICE\",
                      \"namespace\": \"devsecops-$OLD_ENV\",
                      \"port\": $PORT,
                      \"weight\": 100
                    }
                  ]
                }
              ]"

          done

      # ----------------------------------------------------------
      # VERIFY ROLLBACK
      # ----------------------------------------------------------

      - name: Verify rollback
        env:
          EXPECTED_ENV: ${{ needs.prepare.outputs.active_env }}
        run: |
          set -e

          echo "========================================="
          echo "VERIFYING ROLLBACK"
          echo "========================================="

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            BACKEND=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].name}')

            WEIGHT=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].weight}')

            echo "$ROUTE -> $BACKEND = $WEIGHT%"

            if [[ "$BACKEND" != *"-$EXPECTED_ENV" ]]; then
              echo "ERROR: Rollback failed for $ROUTE."
              exit 1
            fi

            if [[ "$WEIGHT" != "100" ]]; then
              echo "ERROR: Rollback traffic is not 100%."
              exit 1
            fi
          done

          echo
          echo "========================================="
          echo "ROLLBACK COMPLETE"
          echo "========================================="
          echo "Production restored to: $EXPECTED_ENV"

