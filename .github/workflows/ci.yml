name: DevSecOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 124666675720.dkr.ecr.ap-south-1.amazonaws.com

  USER_IMAGE: devsecops-user-service
  PRODUCT_IMAGE: devsecops-product-service
  ORDER_IMAGE: devsecops-order-service
  FRONTEND_IMAGE: devsecops-frontend

jobs:
  ci:
    name: Build, Test, Scan & Push
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: -Xmx2g

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # JAVA 21
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          echo "=== Java ==="
          java -version

          echo "=== Maven ==="
          mvn -version

      # ------------------------------------------------------------
      # GITLEAKS
      # ------------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # MAVEN BUILD & TEST
      # ------------------------------------------------------------
      - name: Build and test user-service
        run: |
          echo "=== USER SERVICE ==="
          mvn -B clean verify -f user-service/pom.xml

      - name: Build and test product-service
        run: |
          echo "=== PRODUCT SERVICE ==="
          mvn -B clean verify -f product-service/pom.xml

      - name: Build and test order-service
        run: |
          echo "=== ORDER SERVICE ==="
          mvn -B clean verify -f order-service/pom.xml

      # ------------------------------------------------------------
      # AWS OIDC
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124666675720:role/GitHubActions-DevSecOps-Production
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "=== AWS Identity ==="
          aws sts get-caller-identity

      # ------------------------------------------------------------
      # ECR LOGIN
      # ------------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------
      # DOCKER BUILD
      # ------------------------------------------------------------
      - name: Build Docker images
        run: |
          set -e

          echo "=== Building Docker Images ==="

          docker build \
            -t $ECR_REGISTRY/$USER_IMAGE:${{ github.sha }} \
            ./user-service

          docker build \
            -t $ECR_REGISTRY/$PRODUCT_IMAGE:${{ github.sha }} \
            ./product-service

          docker build \
            -t $ECR_REGISTRY/$ORDER_IMAGE:${{ github.sha }} \
            ./order-service

          docker build \
            -t $ECR_REGISTRY/$FRONTEND_IMAGE:${{ github.sha }} \
            ./frontend

          echo "=== Docker Images ==="
          docker images

      # ------------------------------------------------------------
      # TRIVY
      # ------------------------------------------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Docker images with Trivy
        run: |
          set -e

          echo "=== Trivy Security Scan ==="

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            $ECR_REGISTRY/$USER_IMAGE:${{ github.sha }}

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            $ECR_REGISTRY/$PRODUCT_IMAGE:${{ github.sha }}

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            $ECR_REGISTRY/$ORDER_IMAGE:${{ github.sha }}

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            $ECR_REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}

      # ------------------------------------------------------------
      # PUSH TO ECR
      # ------------------------------------------------------------
      - name: Push Docker images to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e

          echo "=== Pushing Images to ECR ==="

          docker push \
            $ECR_REGISTRY/$USER_IMAGE:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/$PRODUCT_IMAGE:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/$ORDER_IMAGE:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}

          echo "=== ECR Push Completed ==="

      # ------------------------------------------------------------
      # SUMMARY
      # ------------------------------------------------------------
      - name: CI summary
        if: success()
        run: |
          echo "========================================="
          echo "DEVSECOPS CI PIPELINE PASSED"
          echo "========================================="
          echo "Commit: ${{ github.sha }}"
          echo "Images:"
          echo "$ECR_REGISTRY/$USER_IMAGE:${{ github.sha }}"
          echo "$ECR_REGISTRY/$PRODUCT_IMAGE:${{ github.sha }}"
          echo "$ECR_REGISTRY/$ORDER_IMAGE:${{ github.sha }}"
          echo "$ECR_REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}"

