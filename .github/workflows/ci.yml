name: DevSecOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 124666675720.dkr.ecr.ap-south-1.amazonaws.com

  USER_IMAGE: devsecops-user-service
  PRODUCT_IMAGE: devsecops-product-service
  ORDER_IMAGE: devsecops-order-service
  FRONTEND_IMAGE: devsecops-frontend


jobs:

  # ============================================================
  # 1. BUILD & TEST
  # ============================================================

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: -Xmx2g

    strategy:
      fail-fast: true
      matrix:
        service:
          - user-service
          - product-service
          - order-service

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # JAVA 21
      # ----------------------------------------------------------

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ----------------------------------------------------------
      # BUILD & TEST
      # ----------------------------------------------------------

      - name: Build and test ${{ matrix.service }}
        run: |
          set -e

          echo "========================================="
          echo "BUILD & TEST"
          echo "SERVICE: ${{ matrix.service }}"
          echo "========================================="

          mvn -B clean verify \
            -f "${{ matrix.service }}/pom.xml"

      # ----------------------------------------------------------
      # SUMMARY
      # ----------------------------------------------------------

      - name: Service test summary
        if: success()
        run: |
          echo "========================================="
          echo "SERVICE PASSED"
          echo "SERVICE: ${{ matrix.service }}"
          echo "========================================="


  # ============================================================
  # 2. SECURITY SCAN
  # ============================================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # GITLEAKS
      # ----------------------------------------------------------

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # SUMMARY
      # ----------------------------------------------------------

      - name: Security scan summary
        if: success()
        run: |
          echo "========================================="
          echo "SECURITY SCAN PASSED"
          echo "========================================="


  # ============================================================
  # 3. DOCKER BUILD, TRIVY SCAN & PUSH
  # ============================================================

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: security

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # DOCKER BUILD
      # ----------------------------------------------------------

      - name: Build Docker images
        run: |
          set -e

          echo "========================================="
          echo "BUILDING DOCKER IMAGES"
          echo "COMMIT: ${{ github.sha }}"
          echo "========================================="

          docker build \
            -t "$ECR_REGISTRY/$USER_IMAGE:${{ github.sha }}" \
            ./user-service

          docker build \
            -t "$ECR_REGISTRY/$PRODUCT_IMAGE:${{ github.sha }}" \
            ./product-service

          docker build \
            -t "$ECR_REGISTRY/$ORDER_IMAGE:${{ github.sha }}" \
            ./order-service

          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}" \
            ./frontend

          echo
          echo "Docker images built successfully."

      # ----------------------------------------------------------
      # INSTALL TRIVY
      # ----------------------------------------------------------

      - name: Install Trivy
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            apt-transport-https \
            gnupg

          wget -qO - \
            https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # ----------------------------------------------------------
      # TRIVY IMAGE SCAN
      # ----------------------------------------------------------

      - name: Scan Docker images with Trivy
        run: |
          set -e

          echo "========================================="
          echo "TRIVY SECURITY SCAN"
          echo "========================================="

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            "$ECR_REGISTRY/$USER_IMAGE:${{ github.sha }}"

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            "$ECR_REGISTRY/$PRODUCT_IMAGE:${{ github.sha }}"

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            "$ECR_REGISTRY/$ORDER_IMAGE:${{ github.sha }}"

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            "$ECR_REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}"

          echo
          echo "========================================="
          echo "TRIVY SCAN PASSED"
          echo "========================================="

      # ----------------------------------------------------------
      # AWS OIDC
      # Only required for pushing images to ECR.
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124666675720:role/GitHubActions-DevSecOps-Production
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # ECR LOGIN
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # PUSH IMAGES
      # ----------------------------------------------------------

      - name: Push Docker images to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e

          echo "========================================="
          echo "PUSHING IMAGES TO ECR"
          echo "========================================="

          docker push \
            "$ECR_REGISTRY/$USER_IMAGE:${{ github.sha }}"

          docker push \
            "$ECR_REGISTRY/$PRODUCT_IMAGE:${{ github.sha }}"

          docker push \
            "$ECR_REGISTRY/$ORDER_IMAGE:${{ github.sha }}"

          docker push \
            "$ECR_REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}"

          echo
          echo "========================================="
          echo "ECR PUSH COMPLETED"
          echo "========================================="

      # ----------------------------------------------------------
      # FINAL SUMMARY
      # ----------------------------------------------------------

      - name: CI summary
        if: success()
        run: |
          echo
          echo "============================================================"
          echo "              DEVSECOPS CI PIPELINE PASSED"
          echo "============================================================"
          echo
          echo "Commit: ${{ github.sha }}"
          echo
          echo "Images:"
          echo "$ECR_REGISTRY/$USER_IMAGE:${{ github.sha }}"
          echo "$ECR_REGISTRY/$PRODUCT_IMAGE:${{ github.sha }}"
          echo "$ECR_REGISTRY/$ORDER_IMAGE:${{ github.sha }}"
          echo "$ECR_REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}"
          echo
          echo "============================================================"