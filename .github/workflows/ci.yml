name: DevSecOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: -Xmx2g

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # JAVA 21
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          echo "=== Java ==="
          java -version

          echo "=== Maven ==="
          mvn -version

      # ------------------------------------------------------------
      # GITLEAKS
      # ------------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # MAVEN BUILD & TEST
      # ------------------------------------------------------------
      - name: Build and test user-service
        run: |
          echo "=== USER SERVICE ==="
          mvn -B clean verify -f user-service/pom.xml

      - name: Build and test product-service
        run: |
          echo "=== PRODUCT SERVICE ==="
          mvn -B clean verify -f product-service/pom.xml

      - name: Build and test order-service
        run: |
          echo "=== ORDER SERVICE ==="
          mvn -B clean verify -f order-service/pom.xml

      # ------------------------------------------------------------
      # SONARQUBE
      # ------------------------------------------------------------
      # SonarQube will be added after the basic CI pipeline is green.
      # This keeps the first CI implementation focused on proving:
      # checkout -> Java 21 -> build -> test -> security scan.

      # ------------------------------------------------------------
      # CI SUCCESS
      # ------------------------------------------------------------
      - name: CI completed successfully
        run: |
          echo "========================================="
          echo "DEVSECOPS CI PIPELINE PASSED"
          echo "========================================="
