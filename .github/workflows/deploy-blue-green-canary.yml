# This is just for understanding the workflow, it is not used in prodcution. This is a blue-green deployment with canary release strategy. 

name: DevSecOps Blue-Green Canary Production Deployment

on:
  workflow_run:
    workflows:
      - DevSecOps CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-blue-green-canary
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: devsecops-eks
  ECR_REGISTRY: 124666675720.dkr.ecr.ap-south-1.amazonaws.com

  USER_IMAGE: devsecops-user-service
  PRODUCT_IMAGE: devsecops-product-service
  ORDER_IMAGE: devsecops-order-service
  FRONTEND_IMAGE: devsecops-frontend

  PRODUCTION_NAMESPACE: devsecops

  # Canary traffic progression
  CANARY_STAGES: "10 25 50 75 100"


jobs:

  # ============================================================
  # 1. PREPARE PRODUCTION CANDIDATE
  # ============================================================

  prepare:
    name: Prepare Production Candidate
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    outputs:
      version: ${{ steps.release.outputs.version }}
      active_env: ${{ steps.environment.outputs.active_env }}
      inactive_env: ${{ steps.environment.outputs.inactive_env }}

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124666675720:role/GitHubActions-DevSecOps-Production
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -e
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # EKS
      # ----------------------------------------------------------

      - name: Configure kubectl
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          kubectl config current-context
          kubectl cluster-info

      # ----------------------------------------------------------
      # RELEASE VERSION
      # ----------------------------------------------------------

      - name: Determine release version
        id: release
        run: |
          set -e

          VERSION="${{ github.event.workflow_run.head_sha }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "========================================="
          echo "RELEASE VERSION"
          echo "========================================="
          echo "$VERSION"

      # ----------------------------------------------------------
      # DETECT BLUE / GREEN STATE
      # ----------------------------------------------------------

      - name: Detect active environment
        id: environment
        run: |
          set -e

          echo "========================================="
          echo "DETECTING PRODUCTION STATE"
          echo "========================================="

          FRONTEND_BACKEND=$(kubectl get httproute frontend-route \
            -n "$PRODUCTION_NAMESPACE" \
            -o jsonpath='{.spec.rules[0].backendRefs[0].name}')

          echo "frontend-route -> $FRONTEND_BACKEND"

          if [[ "$FRONTEND_BACKEND" == "frontend-blue" ]]; then
            ACTIVE_ENV="blue"
            INACTIVE_ENV="green"

          elif [[ "$FRONTEND_BACKEND" == "frontend-green" ]]; then
            ACTIVE_ENV="green"
            INACTIVE_ENV="blue"

          else
            echo "ERROR: Cannot determine active environment."
            echo "Unexpected backend: $FRONTEND_BACKEND"
            exit 1
          fi

          echo
          echo "Validating all production routes..."

          declare -A EXPECTED_SERVICES

          EXPECTED_SERVICES[frontend-route]="frontend-$ACTIVE_ENV"
          EXPECTED_SERVICES[user-route]="user-service-$ACTIVE_ENV"
          EXPECTED_SERVICES[product-route]="product-service-$ACTIVE_ENV"
          EXPECTED_SERVICES[order-route]="order-service-$ACTIVE_ENV"

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            BACKEND=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].name}')

            EXPECTED="${EXPECTED_SERVICES[$ROUTE]}"

            echo "$ROUTE -> $BACKEND"

            if [[ "$BACKEND" != "$EXPECTED" ]]; then
              echo "ERROR: Production routes are inconsistent."
              exit 1
            fi
          done

          echo
          echo "ACTIVE   : $ACTIVE_ENV"
          echo "INACTIVE : $INACTIVE_ENV"

          echo "active_env=$ACTIVE_ENV" >> "$GITHUB_OUTPUT"
          echo "inactive_env=$INACTIVE_ENV" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # DEPLOY CANDIDATE TO INACTIVE ENVIRONMENT
      # ----------------------------------------------------------

      - name: Deploy candidate to inactive environment
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARGET_ENV: ${{ steps.environment.outputs.inactive_env }}
        run: |
          set -e

          NAMESPACE="devsecops-$TARGET_ENV"

          declare -A DEPLOYMENTS
          declare -A IMAGES

          DEPLOYMENTS[frontend]="frontend-$TARGET_ENV"
          DEPLOYMENTS[user-service]="user-service-$TARGET_ENV"
          DEPLOYMENTS[product-service]="product-service-$TARGET_ENV"
          DEPLOYMENTS[order-service]="order-service-$TARGET_ENV"

          IMAGES[frontend]="$ECR_REGISTRY/$FRONTEND_IMAGE:$VERSION"
          IMAGES[user-service]="$ECR_REGISTRY/$USER_IMAGE:$VERSION"
          IMAGES[product-service]="$ECR_REGISTRY/$PRODUCT_IMAGE:$VERSION"
          IMAGES[order-service]="$ECR_REGISTRY/$ORDER_IMAGE:$VERSION"

          echo "========================================="
          echo "DEPLOYING CANARY CANDIDATE"
          echo "========================================="
          echo "Environment : $TARGET_ENV"
          echo "Namespace   : $NAMESPACE"
          echo "Version     : $VERSION"

          for SERVICE in \
            frontend \
            user-service \
            product-service \
            order-service
          do

            DEPLOYMENT="${DEPLOYMENTS[$SERVICE]}"
            IMAGE="${IMAGES[$SERVICE]}"

            echo
            echo "Deployment : $DEPLOYMENT"
            echo "Image      : $IMAGE"

            kubectl -n "$NAMESPACE" \
              set image deployment/"$DEPLOYMENT" \
              "$SERVICE"="$IMAGE"
          done

      # ----------------------------------------------------------
      # WAIT FOR ROLLOUT
      # ----------------------------------------------------------

      - name: Wait for candidate rollout
        env:
          TARGET_ENV: ${{ steps.environment.outputs.inactive_env }}
        run: |
          set -e

          NAMESPACE="devsecops-$TARGET_ENV"

          for DEPLOYMENT in \
            frontend-$TARGET_ENV \
            user-service-$TARGET_ENV \
            product-service-$TARGET_ENV \
            order-service-$TARGET_ENV
          do

            echo "Waiting for $DEPLOYMENT..."

            kubectl rollout status \
              deployment/"$DEPLOYMENT" \
              -n "$NAMESPACE" \
              --timeout=5m
          done

      # ----------------------------------------------------------
      # VERIFY CANDIDATE
      # ----------------------------------------------------------

      - name: Verify candidate deployments
        env:
          TARGET_ENV: ${{ steps.environment.outputs.inactive_env }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -e

          NAMESPACE="devsecops-$TARGET_ENV"

          for DEPLOYMENT in \
            frontend-$TARGET_ENV \
            user-service-$TARGET_ENV \
            product-service-$TARGET_ENV \
            order-service-$TARGET_ENV
          do

            READY=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.readyReplicas}')

            AVAILABLE=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.availableReplicas}')

            UPDATED=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.updatedReplicas}')

            DESIRED=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.replicas}')

            IMAGE=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo
            echo "$DEPLOYMENT"
            echo "Desired   : $DESIRED"
            echo "Updated   : ${UPDATED:-0}"
            echo "Ready     : ${READY:-0}"
            echo "Available : ${AVAILABLE:-0}"
            echo "Image     : $IMAGE"

            if [[ "${READY:-0}" != "$DESIRED" ]]; then
              echo "ERROR: Deployment not ready."
              exit 1
            fi

            if [[ "${AVAILABLE:-0}" != "$DESIRED" ]]; then
              echo "ERROR: Deployment not available."
              exit 1
            fi

            if [[ "${UPDATED:-0}" != "$DESIRED" ]]; then
              echo "ERROR: Deployment not updated."
              exit 1
            fi

            if [[ "$IMAGE" != *":$VERSION" ]]; then
              echo "ERROR: Wrong image version."
              exit 1
            fi
          done

          echo
          echo "========================================="
          echo "CANARY CANDIDATE READY"
          echo "========================================="


  # ============================================================
  # 2. CANARY TRAFFIC
  # ============================================================

  canary:
    name: Gradual Canary Traffic
    needs: prepare
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124666675720:role/GitHubActions-DevSecOps-Production
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # EKS
      # ----------------------------------------------------------

      - name: Configure kubectl
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      # ----------------------------------------------------------
      # PROGRESSIVE TRAFFIC
      # ----------------------------------------------------------

      - name: Gradually increase canary traffic
        env:
          ACTIVE_ENV: ${{ needs.prepare.outputs.active_env }}
          INACTIVE_ENV: ${{ needs.prepare.outputs.inactive_env }}
        run: |
          set -e

          echo "========================================="
          echo "BLUE-GREEN CANARY DEPLOYMENT"
          echo "========================================="
          echo "STABLE : $ACTIVE_ENV"
          echo "CANARY : $INACTIVE_ENV"
          echo

          for CANARY_WEIGHT in 10 25 50 75 100
          do

            STABLE_WEIGHT=$((100 - CANARY_WEIGHT))

            echo
            echo "============================================================"
            echo "CANARY TRAFFIC: ${CANARY_WEIGHT}%"
            echo "STABLE TRAFFIC: ${STABLE_WEIGHT}%"
            echo "============================================================"

            kubectl patch httproute frontend-route \
              -n "$PRODUCTION_NAMESPACE" \
              --type='json' \
              -p="[
                {
                  \"op\": \"replace\",
                  \"path\": \"/spec/rules/0/backendRefs\",
                  \"value\": [
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"frontend-$ACTIVE_ENV\",
                      \"namespace\": \"devsecops-$ACTIVE_ENV\",
                      \"port\": 80,
                      \"weight\": $STABLE_WEIGHT
                    },
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"frontend-$INACTIVE_ENV\",
                      \"namespace\": \"devsecops-$INACTIVE_ENV\",
                      \"port\": 80,
                      \"weight\": $CANARY_WEIGHT
                    }
                  ]
                }
              ]"

            kubectl patch httproute user-route \
              -n "$PRODUCTION_NAMESPACE" \
              --type='json' \
              -p="[
                {
                  \"op\": \"replace\",
                  \"path\": \"/spec/rules/0/backendRefs\",
                  \"value\": [
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"user-service-$ACTIVE_ENV\",
                      \"namespace\": \"devsecops-$ACTIVE_ENV\",
                      \"port\": 8081,
                      \"weight\": $STABLE_WEIGHT
                    },
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"user-service-$INACTIVE_ENV\",
                      \"namespace\": \"devsecops-$INACTIVE_ENV\",
                      \"port\": 8081,
                      \"weight\": $CANARY_WEIGHT
                    }
                  ]
                }
              ]"

            kubectl patch httproute product-route \
              -n "$PRODUCTION_NAMESPACE" \
              --type='json' \
              -p="[
                {
                  \"op\": \"replace\",
                  \"path\": \"/spec/rules/0/backendRefs\",
                  \"value\": [
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"product-service-$ACTIVE_ENV\",
                      \"namespace\": \"devsecops-$ACTIVE_ENV\",
                      \"port\": 8082,
                      \"weight\": $STABLE_WEIGHT
                    },
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"product-service-$INACTIVE_ENV\",
                      \"namespace\": \"devsecops-$INACTIVE_ENV\",
                      \"port\": 8082,
                      \"weight\": $CANARY_WEIGHT
                    }
                  ]
                }
              ]"

            kubectl patch httproute order-route \
              -n "$PRODUCTION_NAMESPACE" \
              --type='json' \
              -p="[
                {
                  \"op\": \"replace\",
                  \"path\": \"/spec/rules/0/backendRefs\",
                  \"value\": [
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"order-service-$ACTIVE_ENV\",
                      \"namespace\": \"devsecops-$ACTIVE_ENV\",
                      \"port\": 8083,
                      \"weight\": $STABLE_WEIGHT
                    },
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"order-service-$INACTIVE_ENV\",
                      \"namespace\": \"devsecops-$INACTIVE_ENV\",
                      \"port\": 8083,
                      \"weight\": $CANARY_WEIGHT
                    }
                  ]
                }
              ]"

            echo
            echo "Traffic switched to:"
            echo "  Stable : ${STABLE_WEIGHT}%"
            echo "  Canary : ${CANARY_WEIGHT}%"

            # ----------------------------------------------------
            # VERIFY ROUTES
            # ----------------------------------------------------

            for ROUTE in \
              frontend-route \
              user-route \
              product-route \
              order-route
            do

              echo
              echo "----- $ROUTE -----"

              kubectl get httproute "$ROUTE" \
                -n "$PRODUCTION_NAMESPACE" \
                -o jsonpath='{range .spec.rules[0].backendRefs[*]}{.name}{" = "}{.weight}{"%"}{"\n"}{end}'
            done

            # ----------------------------------------------------
            # VERIFY EXPECTED WEIGHTS
            # ----------------------------------------------------

            for ROUTE in \
              frontend-route \
              user-route \
              product-route \
              order-route
            do

              CANARY_ACTUAL=$(kubectl get httproute "$ROUTE" \
                -n "$PRODUCTION_NAMESPACE" \
                -o jsonpath="{.spec.rules[0].backendRefs[?(@.name=='$(case "$ROUTE" in frontend-route) echo frontend-$INACTIVE_ENV;; user-route) echo user-service-$INACTIVE_ENV;; product-route) echo product-service-$INACTIVE_ENV;; order-route) echo order-service-$INACTIVE_ENV;; esac)')].weight")

              if [[ "$CANARY_ACTUAL" != "$CANARY_WEIGHT" ]]; then
                echo "ERROR: $ROUTE canary weight is $CANARY_ACTUAL instead of $CANARY_WEIGHT."
                exit 1
              fi

            done

            # ----------------------------------------------------
            # HOLD EACH CANARY STAGE
            # ----------------------------------------------------

            if [[ "$CANARY_WEIGHT" != "100" ]]; then
              echo
              echo "Canary stage ${CANARY_WEIGHT}% active."
              echo "Waiting 60 seconds before next stage..."
              sleep 60
            fi

          done

          echo
          echo "============================================================"
          echo "CANARY REACHED 100%"
          echo "============================================================"

      # ----------------------------------------------------------
      # FINAL TRAFFIC VERIFICATION
      # ----------------------------------------------------------

      - name: Verify final production traffic
        env:
          EXPECTED_ENV: ${{ needs.prepare.outputs.inactive_env }}
        run: |
          set -e

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            BACKEND=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].name}')

            WEIGHT=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].weight}')

            echo "$ROUTE -> $BACKEND = $WEIGHT%"

            if [[ "$BACKEND" != *"-$EXPECTED_ENV" ]]; then
              echo "ERROR: Wrong final backend."
              exit 1
            fi

            if [[ "$WEIGHT" != "100" ]]; then
              echo "ERROR: Final traffic is not 100%."
              exit 1
            fi
          done

          echo
          echo "========================================="
          echo "BLUE-GREEN CANARY DEPLOYMENT COMPLETE"
          echo "========================================="


  # ============================================================
  # 3. ROLLBACK
  # ============================================================

  rollback:
    name: Rollback Canary Traffic
    needs: [prepare, canary]
    runs-on: ubuntu-latest

    if: >
      always() &&
      needs.prepare.result == 'success' &&
      needs.canary.result == 'failure'

    steps:

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124666675720:role/GitHubActions-DevSecOps-Production
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # EKS
      # ----------------------------------------------------------

      - name: Configure kubectl
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      # ----------------------------------------------------------
      # RESTORE STABLE ENVIRONMENT
      # ----------------------------------------------------------

      - name: Restore stable production traffic
        env:
          ACTIVE_ENV: ${{ needs.prepare.outputs.active_env }}
        run: |
          set -e

          echo "========================================="
          echo "ROLLING BACK CANARY"
          echo "========================================="
          echo "RESTORING: $ACTIVE_ENV"

          declare -A SERVICES
          declare -A PORTS

          SERVICES[frontend-route]="frontend-$ACTIVE_ENV"
          SERVICES[user-route]="user-service-$ACTIVE_ENV"
          SERVICES[product-route]="product-service-$ACTIVE_ENV"
          SERVICES[order-route]="order-service-$ACTIVE_ENV"

          PORTS[frontend-route]=80
          PORTS[user-route]=8081
          PORTS[product-route]=8082
          PORTS[order-route]=8083

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            SERVICE="${SERVICES[$ROUTE]}"
            PORT="${PORTS[$ROUTE]}"

            echo
            echo "$ROUTE -> $SERVICE = 100%"

            kubectl patch httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              --type='json' \
              -p="[
                {
                  \"op\": \"replace\",
                  \"path\": \"/spec/rules/0/backendRefs\",
                  \"value\": [
                    {
                      \"group\": \"\",
                      \"kind\": \"Service\",
                      \"name\": \"$SERVICE\",
                      \"namespace\": \"devsecops-$ACTIVE_ENV\",
                      \"port\": $PORT,
                      \"weight\": 100
                    }
                  ]
                }
              ]"
          done

      # ----------------------------------------------------------
      # VERIFY ROLLBACK
      # ----------------------------------------------------------

      - name: Verify rollback
        env:
          EXPECTED_ENV: ${{ needs.prepare.outputs.active_env }}
        run: |
          set -e

          for ROUTE in \
            frontend-route \
            user-route \
            product-route \
            order-route
          do

            BACKEND=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].name}')

            WEIGHT=$(kubectl get httproute "$ROUTE" \
              -n "$PRODUCTION_NAMESPACE" \
              -o jsonpath='{.spec.rules[0].backendRefs[0].weight}')

            echo "$ROUTE -> $BACKEND = $WEIGHT%"

            if [[ "$BACKEND" != *"-$EXPECTED_ENV" ]]; then
              echo "ERROR: Rollback failed."
              exit 1
            fi

            if [[ "$WEIGHT" != "100" ]]; then
              echo "ERROR: Rollback weight is not 100%."
              exit 1
            fi
          done

          echo
          echo "========================================="
          echo "ROLLBACK COMPLETE"
          echo "========================================="
          echo "Production restored to: $EXPECTED_ENV"